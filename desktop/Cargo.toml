[package]
name = "sincronin-controlin"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Barra flotante para controlar la reproduccion multimedia grupal"
repository = "https://github.com/essence-s/sincronin-controlin"

[dependencies]
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
crossbeam-channel = "0.5"
# WebRTC sin IO: el modulo `net` maneja el socket UDP a mano.
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"] }
# El WebSocket contra el servidor de senalizacion, en modo bloqueante.
tungstenite = { version = "0.30", features = ["native-tls"] }
serde_json = "1"
# El sobre de los mensajes de senalizacion, compartido con el servidor.
protocol = { path = "../protocol" }
# Para los codigos de sala.
rand = "0.9"
# Para enumerar las interfaces de red.
if-addrs = "0.13"

# El servidor, solo para las pruebas de punta a punta: el binario que se
# publica no lo lleva.
[dev-dependencies]
server = { path = "../server" }
tokio = { version = "1", features = ["rt", "net"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "ApplicationModel",
    "Foundation",
    "Foundation_Collections",
    "Management_Deployment",
    "Media",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # Para traducir el AUMID de una sesión al nombre de la app.
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

# MPRIS: el estándar de Linux para controlar reproductores (D-Bus).
# `dbus` se usa directo para escuchar el aviso de que cambió el bus.
[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2"
dbus = "0.9"

[build-dependencies]
slint-build = "1.18.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = "warn"
