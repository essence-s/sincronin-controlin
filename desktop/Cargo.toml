[package]
name = "sincronin-controlin"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Barra flotante para controlar la reproduccion multimedia grupal"
repository = "https://github.com/essence-s/sincronin-controlin"

[dependencies]
slint = { version = "1.18.1", features = ["raw-window-handle-06"] }
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

# MPRIS: el estándar de Linux para controlar reproductores (D-Bus).
[target.'cfg(target_os = "linux")'.dependencies]
mpris = "2"

[build-dependencies]
slint-build = "1.18.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = "warn"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
