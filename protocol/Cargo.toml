[package]
name = "protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Sobre de los mensajes de senalizacion entre el cliente WebRTC y el servidor"
repository = "https://github.com/essence-s/sincronin-controlin"

# Solo serde: este crate lo compila el escritorio, el servidor y (en el
# futuro) el cliente Android. No puede depender de str0m ni de axum, o el
# escritorio arrastraria el framework del servidor.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = "warn"
