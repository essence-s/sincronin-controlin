[package]
name = "server"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Servidor de senalizacion: empareja dos clientes y reenvia la senalizacion"
repository = "https://github.com/essence-s/sincronin-controlin"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
serde_json = "1"
protocol = { path = "../protocol" }

# Para las pruebas de integracion: un cliente de WebSocket.
[dev-dependencies]
tokio-tungstenite = "0.30"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
all = "warn"
